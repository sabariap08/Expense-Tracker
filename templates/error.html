{% extends "base.html" %}

{% block content %}
<section class="section error-page">
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <p>
        {% if session.get('authenticated') %}
        <a class="button button-secondary" href="{{ url_for('dashboard.index') }}">Back to dashboard</a>
        {% else %}
        <a class="button button-secondary" href="{{ url_for('auth.login') }}">Go to sign in</a>
        {% endif %}
    </p>
</section>
{% endblock %}
